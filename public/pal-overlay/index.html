
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pal Spawn Overlay</title>
<style>
:root{--cyan:#00c8ff;--blue:#1768ff}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff}
#overlay{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;gap:2vw;padding:2vw}
#mascot{width:min(34vw,38vh);height:auto;object-fit:contain;filter:drop-shadow(0 0 12px #007dff);flex-shrink:0}
#panel{min-width:45vw;padding:2.1vh 2.4vw;border:2px solid #078bff;border-radius:20px;background:linear-gradient(135deg,rgba(3,15,37,.94),rgba(1,6,20,.84));box-shadow:0 0 20px #0077ff66,inset 0 0 20px #0077ff22;text-align:center}
#heading{font-weight:900;font-size:clamp(18px,3.4vw,52px);letter-spacing:.08em;text-shadow:0 0 12px #00bfff;margin-bottom:1vh}
#timer{font-variant-numeric:tabular-nums;font-size:clamp(34px,7vw,100px);font-weight:900;letter-spacing:.05em;text-shadow:0 0 14px #168cff}
#status{font-size:clamp(12px,1.5vw,20px);color:#9fdfff;margin-top:1vh}
#soundBtn{position:fixed;right:12px;bottom:12px;border:1px solid #13baff;border-radius:10px;padding:8px 12px;background:#06152de8;color:#fff;font-weight:700;cursor:pointer}
#soundBtn:focus-visible{outline:3px solid white}
@media(max-aspect-ratio:1/1){#overlay{flex-direction:column;gap:1vh}#mascot{width:min(38vw,28vh)}#panel{min-width:85vw}}
</style>
</head>
<body>
<main id="overlay">
  <img id="mascot" src="./depresso-shadow.png" alt="Mysterious Pal shadow">
  <section id="panel">
    <div id="heading">NEXT PAL SPAWN</div>
    <div id="timer">--:--</div>
    <div id="status">Connecting to global spawn schedule…</div>
  </section>
</main>
<button id="soundBtn" type="button">Enable spawn sound</button>

<script>
const params = new URLSearchParams(location.search);
const channel = (params.get('channel') || '')
  .replace(/^#/, '').trim().toLowerCase();

const timer = document.querySelector('#timer');
const status = document.querySelector('#status');
const soundBtn = document.querySelector('#soundBtn');

let audioCtx = null;
let lastSpawnId = null;
let lastKnownSpawnAt = null;
let enabled = false;

function enableAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) {
    status.textContent = 'Spawn audio is not supported in this browser.';
    return;
  }
  audioCtx ||= new AC();
  audioCtx.resume();
  enabled = true;
  soundBtn.textContent = 'Spawn sound enabled';
  soundBtn.disabled = true;
}

soundBtn.addEventListener('click', enableAudio);

function playSpawnSound() {
  if (!enabled || !audioCtx) return;

  const now = audioCtx.currentTime;
  [660, 880, 1175].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const start = now + i * 0.09;

    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.16, start + 0.025);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.19);

    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(start);
    osc.stop(start + 0.21);
  });
}

function drawTimer() {
  if (!lastKnownSpawnAt) {
    timer.textContent = '--:--';
    return;
  }

  const remaining = Math.max(
    0,
    Math.ceil((Date.parse(lastKnownSpawnAt) - Date.now()) / 1000)
  );

  timer.textContent =
    String(Math.floor(remaining / 60)).padStart(2, '0') + ':' +
    String(remaining % 60).padStart(2, '0');
}

async function poll() {
  try {
    const scheduleResponse = await fetch('/overlay/api/schedule', {
      cache: 'no-store'
    });

    if (!scheduleResponse.ok) {
      throw new Error('Global schedule request failed: ' + scheduleResponse.status);
    }

    const schedule = await scheduleResponse.json();

    if (!schedule.nextSpawnAt || !Number.isFinite(Date.parse(schedule.nextSpawnAt))) {
      throw new Error('Invalid global spawn time');
    }

    lastKnownSpawnAt = schedule.nextSpawnAt;
    drawTimer();

    // The schedule is global; this extra request is only for this streamer's Pal.
    if (channel) {
      const channelResponse = await fetch(
        '/overlay/api/' + encodeURIComponent(channel),
        { cache: 'no-store' }
      );

      if (!channelResponse.ok) {
        throw new Error('Channel request failed: ' + channelResponse.status);
      }

      const data = await channelResponse.json();
      const monster = data.activeMonster;

      if (monster && monster.id) {
        if (lastSpawnId !== null && monster.id !== lastSpawnId) {
          playSpawnSound();
        }
        lastSpawnId = monster.id;
        status.textContent = 'Global schedule connected · ' + channel + ' · Pal active';
      } else {
        lastSpawnId = null;
        status.textContent = 'Global schedule connected · ' + channel;
      }
    } else {
      status.textContent = 'Global spawn schedule connected';
    }
  } catch (error) {
    status.textContent = 'Connecting to global spawn schedule…';
    console.error('Overlay polling error:', error);
  }
}

poll();
setInterval(poll, 2000);
setInterval(drawTimer, 250);
</script>
</body>
</html>
