
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pal Spawn Overlay</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: transparent;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }

    .panel {
      display: flex;
      align-items: center;
      gap: 18px;
      width: 440px;
      padding: 18px;
      border: 2px solid #55baff;
      border-radius: 18px;
      background: rgba(10, 22, 43, 0.94);
      box-shadow: 0 0 20px rgba(50, 160, 255, 0.35);
    }

    .mascot {
      width: 115px;
      height: 115px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .content {
      flex: 1;
      min-width: 0;
    }

    .heading {
      color: #76ccff;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .countdown {
      margin: 7px 0;
      font-size: 39px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .status {
      color: #c8d8eb;
      font-size: 12px;
    }

    .sound-status {
      margin-top: 7px;
      color: #83d5ff;
      font-size: 11px;
    }
  </style>
</head>

<body>
  <div class="panel">
    <img
      class="mascot"
      src="./depresso-shadow.png"
      alt="Pal mascot"
    />

    <div class="content">
      <div class="heading">Next Pal Spawn</div>
      <div class="countdown" id="countdown">--:--</div>
      <div class="status" id="status">Connecting to spawn schedule...</div>
      <div class="sound-status" id="soundStatus">Automatic sound enabled where permitted</div>
    </div>
  </div>

  <script>
    const countdownEl = document.getElementById("countdown");
    const statusEl = document.getElementById("status");
    const soundStatusEl = document.getElementById("soundStatus");

    let nextSpawnAt = null;
    let lastPlayedSpawnAt = null;
    let audioContext = null;
    let soundUnlocked = false;
    let previousRemaining = null;

    function initialiseAudio() {
      const AudioContextClass =
        window.AudioContext || window.webkitAudioContext;

      if (!AudioContextClass) {
        soundStatusEl.textContent = "Audio is not supported by this browser";
        return;
      }

      try {
        if (!audioContext) {
          audioContext = new AudioContextClass();
        }

        if (audioContext.state === "running") {
          soundUnlocked = true;
        } else {
          audioContext.resume().then(() => {
            soundUnlocked = audioContext.state === "running";
          }).catch(() => {});
        }
      } catch (error) {
        console.warn("Audio initialisation failed:", error);
      }
    }

    function playSpawnSound() {
      if (!audioContext || !soundUnlocked ||
          audioContext.state !== "running") {
        soundStatusEl.textContent =
          "Spawn sound blocked by browser audio permissions";
        return false;
      }

      try {
        const notes = [660, 880, 1175];
        const startTime = audioContext.currentTime;

        notes.forEach((frequency, index) => {
          const oscillator = audioContext.createOscillator();
          const gain = audioContext.createGain();
          const noteStart = startTime + index * 0.18;

          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(frequency, noteStart);

          gain.gain.setValueAtTime(0.0001, noteStart);
          gain.gain.exponentialRampToValueAtTime(0.2, noteStart + 0.025);
          gain.gain.exponentialRampToValueAtTime(0.0001, noteStart + 0.16);

          oscillator.connect(gain);
          gain.connect(audioContext.destination);

          oscillator.start(noteStart);
          oscillator.stop(noteStart + 0.17);
        });

        soundStatusEl.textContent = "Spawn chime played";
        return true;
      } catch (error) {
        console.warn("Unable to play spawn sound:", error);
        return false;
      }
    }

    function formatTime(milliseconds) {
      const totalSeconds = Math.max(0, Math.ceil(milliseconds / 1000));
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;

      return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
    }

    async function loadSchedule() {
      try {
        const response = await fetch("/overlay/api/schedule", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.nextSpawnAt) {
          throw new Error("Schedule response is missing nextSpawnAt");
        }

        const receivedSpawnAt = new Date(data.nextSpawnAt).getTime();

        if (!Number.isFinite(receivedSpawnAt)) {
          throw new Error("Invalid spawn time");
        }

        nextSpawnAt = receivedSpawnAt;
        statusEl.textContent = "Global spawn schedule connected";
      } catch (error) {
        statusEl.textContent = "Unable to connect to spawn schedule";
        console.error("Schedule request failed:", error);
      }
    }

    function updateCountdown() {
      if (!nextSpawnAt) {
        countdownEl.textContent = "--:--";
        return;
      }

      const now = Date.now();
      const remaining = nextSpawnAt - now;

      countdownEl.textContent = formatTime(remaining);

      // Detect crossing the scheduled time, even if a polling request
      // updates nextSpawnAt just after the boundary.
      if (
        previousRemaining !== null &&
        previousRemaining > 0 &&
        remaining <= 0 &&
        lastPlayedSpawnAt !== nextSpawnAt
      ) {
        lastPlayedSpawnAt = nextSpawnAt;
        playSpawnSound();
      }

      previousRemaining = remaining;

      // If the page loads at the exact boundary, avoid repeatedly
      // attempting the same chime.
      if (remaining <= 0 && lastPlayedSpawnAt !== nextSpawnAt) {
        lastPlayedSpawnAt = nextSpawnAt;
        playSpawnSound();
      }
    }

    // Try to initialise audio immediately. Browsers may require
    // a real user gesture before allowing sound.
    initialiseAudio();

    // Retry unlocking after any natural interaction with the page.
    ["pointerdown", "keydown", "touchstart"].forEach((eventName) => {
      document.addEventListener(eventName, initialiseAudio, {
        passive: true
      });
    });

    loadSchedule();
    setInterval(loadSchedule, 5000);
    setInterval(updateCountdown, 200);
  </script>
</body>
</html>
