
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pal Community Game - Spawn Overlay</title>

<style>
:root {
    --cyan: #00c8ff;
    --blue: #1768ff;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

#overlay {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2vw;
    padding: 2vw;
}

#mascot {
    width: min(34vw, 38vh);
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 12px #007dff);
    flex-shrink: 0;
}

#panel {
    min-width: 45vw;
    padding: 2.1vh 2.4vw;
    border: 2px solid #078bff;
    border-radius: 20px;
    background: linear-gradient(
        135deg,
        rgba(3, 15, 37, 0.94),
        rgba(1, 6, 20, 0.84)
    );
    box-shadow:
        0 0 20px #0077ff66,
        inset 0 0 20px #0077ff22;
    text-align: center;
}

#heading {
    font-weight: 900;
    font-size: clamp(18px, 3.4vw, 52px);
    letter-spacing: 0.08em;
    text-shadow: 0 0 12px #00bfff;
    margin-bottom: 1vh;
}

#timer {
    font-variant-numeric: tabular-nums;
    font-size: clamp(34px, 7vw, 100px);
    font-weight: 900;
    letter-spacing: 0.05em;
    text-shadow: 0 0 14px #168cff;
}

#status {
    font-size: clamp(12px, 1.5vw, 20px);
    color: #9fdfff;
    margin-top: 1vh;
}

#soundBtn {
    position: fixed;
    right: 12px;
    bottom: 12px;
    border: 1px solid #13baff;
    border-radius: 10px;
    padding: 8px 12px;
    background: #06152de8;
    color: white;
    font-weight: 700;
    cursor: pointer;
}

#soundBtn:focus-visible {
    outline: 3px solid white;
}

#soundBtn:disabled {
    opacity: 0.8;
    cursor: default;
}

@media (max-aspect-ratio: 1/1) {
    #overlay {
        flex-direction: column;
        gap: 1vh;
    }

    #mascot {
        width: min(38vw, 28vh);
    }

    #panel {
        min-width: 85vw;
    }
}
</style>
</head>

<body>
<main id="overlay">
    <img
        id="mascot"
        src="./depresso-shadow.png"
        alt="Mysterious Pal shadow"
    >

    <section id="panel">
        <div id="heading">NEXT PAL SPAWN</div>
        <div id="timer">--:--</div>
        <div id="status">Connecting to global spawn schedule...</div>
    </section>
</main>

<button id="soundBtn" type="button">Enable spawn sound</button>

<script>
(() => {
    const timer = document.querySelector("#timer");
    const status = document.querySelector("#status");
    const soundBtn = document.querySelector("#soundBtn");

    let audioContext = null;
    let soundEnabled = false;
    let nextSpawnAt = null;
    let lastPlayedSpawnAt = null;
    let pollInProgress = false;

    // Allow the browser to play audio after the user clicks the button.
    async function enableAudio() {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (!AudioContextClass) {
            status.textContent = "Audio is not supported by this browser.";
            return;
        }

        try {
            audioContext ||= new AudioContextClass();
            await audioContext.resume();

            soundEnabled = true;
            soundBtn.textContent = "Spawn sound enabled";
            soundBtn.disabled = true;

            status.textContent = "Sound enabled - global schedule connected";

            // Test the sound immediately so the user knows audio works.
            playSpawnSound();
        } catch (error) {
            status.textContent = "Click again to enable spawn sound.";
        }
    }

    soundBtn.addEventListener("click", enableAudio);

    // Short three-note game-like chime.
    function playSpawnSound() {
        if (!soundEnabled || !audioContext) return;

        const start = audioContext.currentTime;
        const notes = [660, 880, 1175];

        notes.forEach((frequency, index) => {
            const time = start + index * 0.1;
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();

            oscillator.type = "triangle";
            oscillator.frequency.setValueAtTime(frequency, time);

            gain.gain.setValueAtTime(0.0001, time);
            gain.gain.exponentialRampToValueAtTime(
                0.14,
                time + 0.025
            );
            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                time + 0.22
            );

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.start(time);
            oscillator.stop(time + 0.23);
        });
    }

    function updateCountdown() {
        if (!nextSpawnAt) {
            timer.textContent = "--:--";
            return;
        }

        const targetTime = Date.parse(nextSpawnAt);

        if (!Number.isFinite(targetTime)) {
            timer.textContent = "--:--";
            return;
        }

        const remaining = Math.max(
            0,
            Math.ceil((targetTime - Date.now()) / 1000)
        );

        const minutes = String(
            Math.floor(remaining / 60)
        ).padStart(2, "0");

        const seconds = String(
            remaining % 60
        ).padStart(2, "0");

        timer.textContent = `${minutes}:${seconds}`;

        // Play at most once for each distinct scheduled timestamp.
        if (
            remaining === 0 &&
            lastPlayedSpawnAt !== nextSpawnAt
        ) {
            lastPlayedSpawnAt = nextSpawnAt;
            playSpawnSound();
        }
    }

    async function pollSchedule() {
        if (pollInProgress) return;
        pollInProgress = true;

        try {
            const response = await fetch("/overlay/api/schedule", {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error(`Schedule request failed: ${response.status}`);
            }

            const data = await response.json();

            if (
                !data.nextSpawnAt ||
                !Number.isFinite(Date.parse(data.nextSpawnAt))
            ) {
                throw new Error("Invalid spawn schedule received");
            }

            nextSpawnAt = data.nextSpawnAt;
            status.textContent = soundEnabled
                ? "Global schedule connected - sound enabled"
                : "Global schedule connected";
        } catch (error) {
            status.textContent = "Waiting for game server connection";
            console.error("Pal overlay schedule error:", error);
        } finally {
            pollInProgress = false;
            updateCountdown();
        }
    }

    // Poll the shared server schedule and keep the display smooth.
    pollSchedule();
    window.setInterval(pollSchedule, 2000);
    window.setInterval(updateCountdown, 250);
})();
</script>
</body>
</html>
