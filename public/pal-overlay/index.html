<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pal Spawn Overlay</title>
<style>
:root{--cyan:#00c8ff;--blue:#1768ff;--panel:rgba(5,14,32,.88)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:#fff}
#overlay{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;gap:2vw;padding:2vw}
#mascot{width:min(34vw,38vh);height:auto;object-fit:contain;filter:drop-shadow(0 0 12px #007dff);flex-shrink:0}
#panel{min-width:45vw;padding:2.1vh 2.4vw;border:2px solid #078bff;border-radius:20px;background:linear-gradient(135deg,rgba(3,15,37,.94),rgba(1,6,20,.84));box-shadow:0 0 20px #0077ff66,inset 0 0 20px #0077ff22;text-align:center}
#heading{font-weight:900;font-size:clamp(18px,3.4vw,52px);letter-spacing:.08em;text-shadow:0 0 12px #00bfff;margin-bottom:1vh}
#timer{font-variant-numeric:tabular-nums;font-size:clamp(34px,7vw,100px);font-weight:900;letter-spacing:.05em;text-shadow:0 0 14px #168cff}
#status{font-size:clamp(12px,1.5vw,20px);color:#9fdfff;margin-top:1vh}
#soundBtn{position:fixed;right:12px;bottom:12px;border:1px solid #13baff;border-radius:10px;padding:8px 12px;background:#06152de8;color:#fff;font-weight:700;cursor:pointer}
#soundBtn:focus-visible{outline:3px solid white}
@media(max-aspect-ratio:1/1){#overlay{flex-direction:column;gap:1vh}#mascot{width:min(38vw,28vh)}#panel{min-width:85vw}}
</style></head>
<body><main id="overlay"><img id="mascot" src="./depresso-shadow.png" alt="Blacked-out Depresso-style mascot"><section id="panel"><div id="heading">NEXT PAL SPAWN</div><div id="timer">--:--</div><div id="status">Waiting for spawn timer connectionâ€¦</div></section></main><button id="soundBtn" type="button">Enable spawn sound</button>
<script>
// Overlay client. It expects the game server to expose GET /api/overlay/spawn-status?channel=CHANNEL
// JSON: { nextSpawnAt: ISO timestamp|null, spawnId: string|null, active: boolean }
const params=new URLSearchParams(location.search);const channel=(params.get('channel')||'').replace(/^#/,'').trim().toLowerCase();
const timer=document.querySelector('#timer'),status=document.querySelector('#status'),soundBtn=document.querySelector('#soundBtn');
let audioCtx=null,lastSpawnId=null,lastKnownSpawnAt=null,enabled=false;
function enableAudio(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC){status.textContent='This browser does not support spawn audio.';return}audioCtx ||= new AC();audioCtx.resume();enabled=true;soundBtn.textContent='Spawn sound enabled';soundBtn.disabled=true;}
soundBtn.addEventListener('click',enableAudio);
function playSpawnSound(){if(!enabled||!audioCtx)return;const now=audioCtx.currentTime;const notes=[660,880,1175];notes.forEach((freq,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();osc.type='triangle';osc.frequency.setValueAtTime(freq,now+i*.09);gain.gain.setValueAtTime(.0001,now+i*.09);gain.gain.exponentialRampToValueAtTime(.16,now+i*.09+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+i*.09+.19);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(now+i*.09);osc.stop(now+i*.09+.21)});}
function drawTimer(){if(!lastKnownSpawnAt){timer.textContent='--:--';return}const seconds=Math.max(0,Math.ceil((new Date(lastKnownSpawnAt).getTime()-Date.now())/1000));timer.textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
async function poll(){if(!channel){status.textContent='Add ?channel=yourtwitchchannel to the overlay URL.';return}try{const response=await fetch(`/overlay/api/${encodeURIComponent(channel)}`,{cache:'no-store'});if(!response.ok)throw new Error('Overlay API returned '+response.status);const data=await response.json();lastKnownSpawnAt=data.nextSpawnAt||null;if(data.spawnId&&lastSpawnId&&data.spawnId!==lastSpawnId)playSpawnSound();if(data.spawnId)lastSpawnId=data.spawnId;status.textContent=data.active?'Spawn timer connected Â· '+channel:'Waiting for the next Pal spawn Â· '+channel;drawTimer();}catch(e){status.textContent='Waiting for game server connection Â· '+channel;drawTimer();}}
setInterval(drawTimer,250);poll();setInterval(poll,2000);
</script></body></html>
